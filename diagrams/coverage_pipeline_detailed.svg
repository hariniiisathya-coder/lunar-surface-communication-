<svg width="680" height="696" viewBox="0 0 680 696" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Detailed lunar coverage pipeline flowchart</title>
<desc>Flowchart of the S1 coverage pipeline: DEM and transmitter input feed a line-of-sight check. Visible pixels sample the Siegler regolith dielectric map and compute two-ray Fresnel path loss. Shadowed pixels extract a terrain profile and compute Deygout diffraction plus free-space loss. Both merge into a link margin calculation that produces the final coverage map.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="696" fill="#FFFFFF"/>

<rect x="230" y="20" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">DEM + transmitter</text>
<text x="340" y="62" text-anchor="middle" font-size="12" fill="#444441">PGDA-78, 5 m/pixel</text>

<line x1="340" y1="76" x2="340" y2="136" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="136" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Line of sight?</text>
<text x="340" y="178" text-anchor="middle" font-size="12" fill="#444441">Raycast from TX</text>

<path d="M340,192 L340,222 L145,222 L145,252" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340,192 L340,222 L535,222 L535,252" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="242" y="212" text-anchor="middle" font-size="12" fill="#5F5E5A">visible</text>
<text x="437" y="212" text-anchor="middle" font-size="12" fill="#5F5E5A">shadowed</text>

<rect x="50" y="252" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="145" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Regolith lookup</text>
<text x="145" y="294" text-anchor="middle" font-size="12" fill="#085041">Siegler a'/b' map</text>

<rect x="440" y="252" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="535" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">Extract profile</text>
<text x="535" y="294" text-anchor="middle" font-size="12" fill="#712B13">TX-to-pixel profile</text>

<line x1="145" y1="308" x2="145" y2="368" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="535" y1="308" x2="535" y2="368" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="368" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="145" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Two-ray + Fresnel</text>
<text x="145" y="410" text-anchor="middle" font-size="12" fill="#085041">Path loss, dB</text>

<rect x="440" y="368" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="535" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">Diffraction</text>
<text x="535" y="410" text-anchor="middle" font-size="12" fill="#712B13">Deygout + FSPL, dB</text>

<path d="M145,424 L145,454 L340,454 L340,484" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M535,424 L535,454 L340,454 L340,484" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="484" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="506" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Link margin</text>
<text x="340" y="526" text-anchor="middle" font-size="12" fill="#444441">dB margin per pixel</text>

<line x1="340" y1="540" x2="340" y2="600" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="600" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="622" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Coverage map</text>
<text x="340" y="642" text-anchor="middle" font-size="12" fill="#444441">Margin &gt; 0 = covered</text>
</svg>
