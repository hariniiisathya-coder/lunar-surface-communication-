[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lunarcomms"
version = "0.1.0"
description = "Open-source toolchain for lunar wireless communications research"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Lunar Comms Survey Team" },
]
keywords = ["lunar", "communications", "propagation", "5G", "NTN", "DTN", "SPICE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "rasterio>=1.3",
  "pyproj>=3.5",
  "spiceypy>=6.0",
  "astropy>=5.3",
  "pandas>=2.0",
  "tqdm>=4.65",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=23.0",
  "ruff>=0.1",
  "mypy>=1.5",
  "jupyter>=1.0",
  "ipykernel>=6.25",
  "notebook>=7.0",
]
sionna = [
  "sionna>=0.19",
  "tensorflow>=2.13",
]

[project.urls]
Repository = "https://github.com/YOUR_ORG/lunar-comms-survey"
Issues     = "https://github.com/YOUR_ORG/lunar-comms-survey/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lunarcomms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.black]
line-length    = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select      = ["E", "F", "W", "I"]
